<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Common</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-act="skip">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#discover" aria-label="Common, back to Discover">common<span>_</span></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="wrap foot">
    <span>Common · Weekly small-group meetups for newcomers in Heidelberg.</span>
    <button type="button" class="btn-link" data-act="reset">Reset demo data</button>
  </footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">All activities</h2>
      <button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
